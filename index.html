<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffdf7">
  <meta name="description" content="Evia — Time, Progress, Learning and Skill Scan.">
  <title>Evia</title>
  <style>
    :root {
      --paper: #fffdf7;
      --ink: #111111;
      --gold: #eab400;
      --gold-soft: #f7d96a;
      --ball: #f5ad00;
      --ball-deep: #e49300;
      --shadow: rgba(53, 43, 16, .13);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.95), rgba(247,244,236,.9) 62%, rgba(235,231,221,.9)),
        #f2efe7;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    button { font: inherit; }

    .phone {
      position: relative;
      width: min(100vw, 430px);
      height: min(100svh, 900px);
      min-height: 620px;
      overflow: hidden;
      background: var(--paper);
      border: 9px solid #090909;
      border-radius: 58px;
      box-shadow: 0 28px 70px var(--shadow), 0 4px 14px rgba(0,0,0,.14);
      isolation: isolate;
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 5;
      top: 20px;
      left: 50%;
      width: 104px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #050505;
    }

    .phone::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      border-radius: 49px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    }

    .screen {
      position: absolute;
      inset: 0;
      padding: 74px 24px 30px;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
    }

    .arc {
      position: absolute;
      width: 210px;
      height: 210px;
      border: 4px solid var(--gold);
      border-radius: 50%;
      pointer-events: none;
    }

    .arc.top-left {
      top: 64px;
      left: 22px;
      clip-path: polygon(0 0, 100% 0, 100% 48%, 0 48%);
      transform: rotate(-17deg);
    }

    .arc.top-right {
      top: 64px;
      right: 22px;
      clip-path: polygon(0 0, 100% 0, 100% 48%, 0 48%);
      transform: rotate(17deg);
    }

    .arc.bottom-left {
      bottom: 65px;
      left: 22px;
      clip-path: polygon(0 52%, 100% 52%, 100% 100%, 0 100%);
      transform: rotate(17deg);
    }

    .arc.bottom-right {
      bottom: 65px;
      right: 22px;
      clip-path: polygon(0 52%, 100% 52%, 100% 100%, 0 100%);
      transform: rotate(-17deg);
    }

    .nav {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .nav-item {
      position: absolute;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: clamp(23px, 6vw, 31px);
      font-weight: 500;
      letter-spacing: -.035em;
      cursor: pointer;
      padding: 10px;
      line-height: 1;
      transition: transform .2s ease, color .2s ease;
      pointer-events: auto;
    }

    .nav-item:hover,
    .nav-item:focus-visible {
      color: #9b7500;
      transform: scale(1.04);
      outline: none;
    }

    .nav-item.active { color: #9b7500; }

    .time { top: 135px; left: 82px; transform: rotate(-51deg); }
    .progress { top: 125px; right: 61px; transform: rotate(18deg); }
    .learning { bottom: 119px; left: 70px; transform: rotate(42deg); }
    .skills { bottom: 119px; right: 43px; transform: rotate(-48deg); }

    .nav-item.time:hover, .nav-item.time:focus-visible { transform: rotate(-51deg) scale(1.04); }
    .nav-item.progress:hover, .nav-item.progress:focus-visible { transform: rotate(18deg) scale(1.04); }
    .nav-item.learning:hover, .nav-item.learning:focus-visible { transform: rotate(42deg) scale(1.04); }
    .nav-item.skills:hover, .nav-item.skills:focus-visible { transform: rotate(-48deg) scale(1.04); }

    .hero {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      align-self: center;
      margin-top: 24px;
    }

    .character-wrap {
      position: relative;
      width: 188px;
      height: 188px;
      display: grid;
      place-items: center;
    }

    .character-wrap::before {
      content: "";
      position: absolute;
      width: 155px;
      height: 22px;
      bottom: 5px;
      border-radius: 50%;
      background: rgba(105, 75, 0, .18);
      filter: blur(8px);
      transform: scaleX(1.15);
    }

    .character {
      position: relative;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle at 37% 28%, #ffc934 0%, var(--ball) 35%, var(--ball-deep) 100%);
      box-shadow: inset -14px -17px 25px rgba(174, 91, 0, .13), inset 10px 10px 19px rgba(255, 230, 100, .28), 0 10px 18px rgba(141, 94, 0, .15);
      animation: float 4.2s ease-in-out infinite;
    }

    .eye {
      position: absolute;
      top: 61px;
      width: 15px;
      height: 49px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fff 0%, #fffdf3 100%);
      box-shadow: 0 0 8px rgba(255,255,255,.9);
    }

    .eye.left { left: 54px; }
    .eye.right { right: 54px; }

    .status {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 74px;
      width: min(82%, 310px);
      transform: translateX(-50%);
      text-align: center;
      font-size: 13px;
      letter-spacing: .02em;
      opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .status.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    .brand {
      position: absolute;
      z-index: 4;
      bottom: 23px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 600;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @media (min-width: 700px) {
      .phone { height: min(900px, calc(100svh - 40px)); }
    }

    @media (max-height: 700px) {
      .phone { min-height: 0; border-radius: 42px; }
      .phone::before { top: 13px; height: 25px; width: 88px; }
      .screen { padding-top: 58px; }
      .nav-item { font-size: 22px; }
      .time { top: 108px; left: 68px; }
      .progress { top: 102px; right: 50px; }
      .learning { bottom: 87px; left: 58px; }
      .skills { bottom: 87px; right: 34px; }
      .character-wrap { width: 145px; height: 145px; }
      .character { width: 132px; height: 132px; }
      .eye { top: 48px; width: 12px; height: 39px; }
      .eye.left { left: 42px; }
      .eye.right { right: 42px; }
      .brand { bottom: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .character { animation: none; }
      .nav-item, .status { transition: none; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Evia home">
    <div class="screen">
      <div class="arc top-left"></div>
      <div class="arc top-right"></div>
      <div class="arc bottom-left"></div>
      <div class="arc bottom-right"></div>

      <nav class="nav" aria-label="Evia sections">
        <button class="nav-item time" data-section="Time" aria-label="Open Time">Time</button>
        <button class="nav-item progress" data-section="Progress" aria-label="Open Progress">Progress</button>
        <button class="nav-item learning" data-section="Learning" aria-label="Open Learning">Learning</button>
        <button class="nav-item skills" data-section="Skill Scan" aria-label="Open Skill Scan">Skill Scan</button>
      </nav>

      <section class="hero" aria-label="Evia">
        <div class="character-wrap">
          <div class="character" aria-hidden="true">
            <span class="eye left"></span>
            <span class="eye right"></span>
          </div>
        </div>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="brand">Evia</div>
    </div>
  </main>

  <script>
    const items = document.querySelectorAll('.nav-item');
    const status = document.getElementById('status');
    let timer;

    items.forEach(item => {
      item.addEventListener('click', () => {
        items.forEach(button => button.classList.remove('active'));
        item.classList.add('active');
        status.textContent = `${item.dataset.section} selected`;
        status.classList.add('visible');
        clearTimeout(timer);
        timer = setTimeout(() => status.classList.remove('visible'), 1800);
      });
    });
  </script>
</body>
</html>
