<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evia</title>
<style>
:root{--paper:#fffdf7;--ink:#111;--gold:#eab400;--ball:#f5ad00;--deep:#e49300}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{min-height:100svh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.page{position:relative;width:100vw;height:100svh;min-height:560px;overflow:hidden}
.corner{position:absolute;width:33.333vw;height:12.5vh;min-height:65px;max-height:110px;z-index:3}.corner:after{content:"";position:absolute;width:72%;height:180%;border:3px solid var(--gold);border-radius:50%;pointer-events:none}.top-left{top:3.5vh;left:2.5vw}.top-right{top:3.5vh;right:2.5vw}.bottom-left{bottom:3.5vh;left:2.5vw}.bottom-right{bottom:3.5vh;right:2.5vw}.top-left:after{right:-5%;top:-88%;transform:rotate(-17deg);clip-path:polygon(0 48%,100% 48%,100% 100%,0 100%)}.top-right:after{left:-5%;top:-88%;transform:rotate(17deg);clip-path:polygon(0 48%,100% 48%,100% 100%,0 100%)}.bottom-left:after{right:-5%;bottom:-88%;transform:rotate(17deg);clip-path:polygon(0 0,100% 0,100% 52%,0 52%)}.bottom-right:after{left:-5%;bottom:-88%;transform:rotate(-17deg);clip-path:polygon(0 0,100% 0,100% 52%,0 52%)}
.nav-item{position:absolute;z-index:4;border:0;background:transparent;color:var(--ink);padding:5px;font-size:clamp(15px,1.65vw,22px);font-weight:500;letter-spacing:-.035em;line-height:1;cursor:pointer;white-space:nowrap;transition:color .2s,transform .2s}.nav-item:hover,.nav-item:focus-visible,.nav-item.active{color:#9b7500;outline:none}.time{left:17%;top:27%;transform:rotate(-51deg)}.progress{right:14%;top:24%;transform:rotate(18deg)}.learning{left:14%;bottom:24%;transform:rotate(42deg)}.skills{right:11%;bottom:23%;transform:rotate(-48deg)}.time:hover,.time:focus-visible{transform:rotate(-51deg) scale(1.05)}.progress:hover,.progress:focus-visible{transform:rotate(18deg) scale(1.05)}.learning:hover,.learning:focus-visible{transform:rotate(42deg) scale(1.05)}.skills:hover,.skills:focus-visible{transform:rotate(-48deg) scale(1.05)}
.hero{position:absolute;inset:0;display:grid;place-items:center;z-index:2}.character-wrap{position:relative;width:210px;height:210px;display:grid;place-items:center}.character-wrap:before{content:"";position:absolute;width:145px;height:20px;bottom:14px;border-radius:50%;background:rgba(105,75,0,.17);filter:blur(8px)}.character{position:relative;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 37% 28%,#ffc934 0%,var(--ball) 35%,var(--deep) 100%);box-shadow:inset -14px -17px 25px rgba(174,91,0,.13),inset 10px 10px 19px rgba(255,230,100,.28),0 10px 18px rgba(141,94,0,.15);animation:float 4.2s ease-in-out infinite}.eye{position:absolute;top:61px;width:15px;height:49px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.9)}.eye.left{left:54px}.eye.right{right:54px}.status{position:absolute;z-index:5;left:50%;bottom:5.5vh;transform:translateX(-50%);width:min(80%,320px);text-align:center;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none}.status.visible{opacity:1}.brand{position:absolute;z-index:4;left:50%;bottom:1.8vh;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(max-width:600px){.corner:after{border-width:2.5px}.nav-item{font-size:clamp(13px,4.1vw,18px)}.time{left:14%;top:28%}.progress{right:10%;top:26%}.learning{left:11%;bottom:25%}.skills{right:7%;bottom:24%}.character-wrap{width:185px;height:185px}.character{width:150px;height:150px}.eye{top:54px;width:13px;height:43px}.eye.left{left:48px}.eye.right{right:48px}}@media(max-height:600px){.character-wrap{transform:scale(.78)}.corner{min-height:55px}}@media(prefers-reduced-motion:reduce){.character{animation:none}}
</style>
</head>
<body>
<main class="page" aria-label="Evia home">
<section class="corner top-left" aria-hidden="true"></section><section class="corner top-right" aria-hidden="true"></section><section class="corner bottom-left" aria-hidden="true"></section><section class="corner bottom-right" aria-hidden="true"></section>
<nav aria-label="Evia sections"><button class="nav-item time" data-section="Time">Time</button><button class="nav-item progress" data-section="Progress">Progress</button><button class="nav-item learning" data-section="Learning">Learning</button><button class="nav-item skills" data-section="Skill Scan">Skill Scan</button></nav>
<section class="hero" aria-label="Evia"><div class="character-wrap"><div class="character" aria-hidden="true"><span class="eye left"></span><span class="eye right"></span></div></div></section>
<p class="status" id="status" role="status" aria-live="polite"></p><div class="brand">Evia</div>
</main>
<script>const items=document.querySelectorAll('.nav-item'),status=document.getElementById('status');let timer;items.forEach(item=>item.addEventListener('click',()=>{items.forEach(b=>b.classList.remove('active'));item.classList.add('active');status.textContent=item.dataset.section+' selected';status.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>status.classList.remove('visible'),1800)}));</script>
</body>
</html>
