<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evia</title>
<style>
:root{--bg:#fffdf7;--ink:#111;--yellow:#eab400;--orange:#f5ad00;--orange2:#e49300}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.page{position:relative;width:100vw;height:100svh;min-height:560px;overflow:hidden}
.corner{position:absolute;width:31vw;height:15vh;z-index:3}.corner svg{position:absolute;width:100%;height:100%;overflow:visible}.corner path{fill:none;stroke:var(--yellow);stroke-width:3;stroke-linecap:round}.tl{left:4.5vw;top:3vh}.tr{right:4.5vw;top:3vh}.bl{left:4.5vw;bottom:3vh}.br{right:4.5vw;bottom:3vh}.tr svg,.br svg{transform:scaleX(-1)}.bl svg{transform:scaleY(-1)}.br svg{transform:scale(-1,-1)}
.nav{position:absolute;inset:0;z-index:4}.nav button{position:absolute;border:0;background:none;color:var(--ink);font-size:clamp(15px,2vw,22px);font-weight:500;letter-spacing:-.04em;padding:4px;cursor:pointer;line-height:1;white-space:nowrap}.nav button:hover,.nav button:focus-visible,.nav button.active{color:#987300;outline:none}.time{left:11.5vw;top:12vh;transform:rotate(-42deg)}.progress{right:10vw;top:11.5vh;transform:rotate(20deg)}.learning{left:10vw;bottom:11vh;transform:rotate(42deg)}.skills{right:7.5vw;bottom:11vh;transform:rotate(-42deg)}
.hero{position:absolute;inset:0;display:grid;place-items:center;z-index:2}.orb-wrap{position:relative;width:min(38vw,370px);aspect-ratio:1}.orb-wrap:after{content:"";position:absolute;left:12%;right:12%;bottom:-2%;height:8%;border-radius:50%;background:rgba(120,80,0,.16);filter:blur(12px)}.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 36% 27%,#ffd13d 0%,var(--orange) 38%,var(--orange2) 100%);box-shadow:inset -18px -22px 28px rgba(174,91,0,.12),inset 14px 13px 22px rgba(255,235,130,.28),0 14px 22px rgba(141,94,0,.1)}.eye{position:absolute;top:36%;width:9%;height:29%;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.95)}.eye.left{left:32%}.eye.right{right:32%}.brand{position:absolute;left:50%;bottom:5.5vh;transform:translateX(-50%);font-size:clamp(12px,1.5vw,17px);font-weight:600;letter-spacing:.18em}.status{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);font-size:12px;opacity:0;transition:opacity .2s}.status.visible{opacity:1}
@media(max-width:600px){.corner{width:34vw;height:13vh}.corner path{stroke-width:2.5}.tl,.bl{left:5vw}.tr,.br{right:5vw}.nav button{font-size:clamp(15px,4.5vw,19px)}.time{left:9vw;top:12vh}.progress{right:7vw;top:11vh}.learning{left:8vw;bottom:11vh}.skills{right:5vw;bottom:11vh}.orb-wrap{width:36vw;min-width:145px;max-width:175px}.brand{bottom:3.8vh;font-size:12px}}
@media(max-height:600px){.orb-wrap{transform:scale(.78)}.corner{height:14vh}.brand{bottom:2vh}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body>
<main class="page" aria-label="Evia home">
<div class="corner tl" aria-hidden="true"><svg viewBox="0 0 300 120"><path d="M25 94 A105 105 0 0 1 154 12"/></svg></div>
<div class="corner tr" aria-hidden="true"><svg viewBox="0 0 300 120"><path d="M25 94 A105 105 0 0 1 154 12"/></svg></div>
<div class="corner bl" aria-hidden="true"><svg viewBox="0 0 300 120"><path d="M25 94 A105 105 0 0 1 154 12"/></svg></div>
<div class="corner br" aria-hidden="true"><svg viewBox="0 0 300 120"><path d="M25 94 A105 105 0 0 1 154 12"/></svg></div>
<nav class="nav" aria-label="Evia sections">
<button class="time" data-section="Time">Time</button><button class="progress" data-section="Progress">Progress</button><button class="learning" data-section="Learning">Learning</button><button class="skills" data-section="Skill Scan">Skill Scan</button>
</nav>
<section class="hero" aria-label="Evia"><div class="orb-wrap"><div class="orb"><span class="eye left"></span><span class="eye right"></span></div></div></section>
<p class="status" id="status" role="status" aria-live="polite"></p><div class="brand">EVIA</div>
</main>
<script>const buttons=document.querySelectorAll('.nav button'),status=document.getElementById('status');let timer;buttons.forEach(b=>b.addEventListener('click',()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');status.textContent=b.dataset.section+' selected';status.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>status.classList.remove('visible'),1600)}));</script>
</body>
</html>
